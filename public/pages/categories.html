<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Categories - Stock Taking System
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">

</head>


<body class="bg-light">


<nav class="navbar navbar-dark bg-primary">

    <div class="container-fluid">

        <a
            href="/dashboard.html"
            class="navbar-brand">

            <i class="bi bi-box-seam me-2"></i>

            Pajebe Stock Taking System

        </a>


        <div>

            <a
                href="/dashboard.html"
                class="btn btn-light btn-sm">

                <i class="bi bi-speedometer2 me-1"></i>

                Dashboard

            </a>

        </div>

    </div>

</nav>



<main class="container-fluid px-3 px-lg-4 py-4">


    <div
        class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">


        <div>

            <h2 class="mb-1">

                <i class="bi bi-tags me-2"></i>

                Categories

            </h2>

            <p class="text-muted mb-0">

                Organize your products into categories.

            </p>

        </div>


        <button
            id="addCategoryButton"
            class="btn btn-primary">

            <i class="bi bi-plus-circle me-1"></i>

            Add Category

        </button>

    </div>



    <div id="message"></div>



    <div class="card border-0 shadow-sm">


        <div class="card-header bg-white py-3">


            <div class="row g-2 align-items-center">


                <div class="col-12 col-md-7">

                    <div class="input-group">

                        <span class="input-group-text">

                            <i class="bi bi-search"></i>

                        </span>


                        <input
                            type="text"
                            id="searchCategory"
                            class="form-control"
                            placeholder="Search category...">

                    </div>

                </div>


                <div class="col-12 col-md-3">

                    <select
                        id="statusFilter"
                        class="form-select">

                        <option value="all">
                            All Status
                        </option>

                        <option value="active">
                            Active
                        </option>

                        <option value="inactive">
                            Inactive
                        </option>

                    </select>

                </div>


                <div
                    class="col-12 col-md-2 text-md-end">

                    <span class="text-muted">

                        Total:

                        <strong id="categoryCount">
                            0
                        </strong>

                    </span>

                </div>

            </div>

        </div>



        <div class="card-body p-0">


            <div class="table-responsive">

                <table
                    class="table table-hover align-middle mb-0">


                    <thead class="table-light">

                        <tr>

                            <th>
                                #
                            </th>

                            <th>
                                Category
                            </th>

                            <th>
                                Description
                            </th>

                            <th>
                                Products
                            </th>

                            <th>
                                Status
                            </th>

                            <th class="text-end">
                                Actions
                            </th>

                        </tr>

                    </thead>


                    <tbody id="categoriesTable">

                        <tr>

                            <td
                                colspan="6"
                                class="text-center py-5">

                                <div
                                    class="spinner-border text-primary">
                                </div>

                                <div
                                    class="text-muted mt-2">

                                    Loading categories...

                                </div>

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</main>



<!-- CATEGORY MODAL -->

<div
    class="modal fade"
    id="categoryModal"
    tabindex="-1">


    <div
        class="modal-dialog modal-dialog-centered">


        <div class="modal-content">


            <div class="modal-header">

                <h5
                    id="categoryModalTitle"
                    class="modal-title">

                    Add Category

                </h5>


                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal">
                </button>

            </div>


            <form id="categoryForm">


                <div class="modal-body">


                    <input
                        type="hidden"
                        id="categoryId">


                    <div class="mb-3">

                        <label
                            class="form-label">

                            Category Name
                            <span class="text-danger">
                                *
                            </span>

                        </label>


                        <input
                            type="text"
                            id="categoryName"
                            class="form-control"
                            maxlength="100"
                            required>

                    </div>


                    <div class="mb-3">

                        <label
                            class="form-label">

                            Description

                        </label>


                        <textarea
                            id="categoryDescription"
                            class="form-control"
                            rows="4"
                            maxlength="1000"></textarea>

                    </div>

                </div>


                <div class="modal-footer">

                    <button
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">

                        Cancel

                    </button>


                    <button
                        type="submit"
                        id="saveCategoryButton"
                        class="btn btn-primary">

                        <i
                            class="bi bi-check-circle me-1">
                        </i>

                        Save Category

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

<!-- =====================================================
     FOOTER
===================================================== -->

<footer class="bg-white border-top mt-4 py-3">

    <div class="container-fluid px-3 px-lg-4">

        <div
            class="d-flex flex-column flex-md-row justify-content-between align-items-center gap-2">

            <div class="text-muted small">

                <i class="bi bi-box-seam me-1"></i>

                Stock Taking System

            </div>


            <div class="text-muted small">

                &copy;

                <span id="copyrightYear"></span>

                Stock Taking System.

                All rights reserved.

            </div>


            <div class="text-muted small">

                Developed by <strong class="text-primary">Atupakisye Elias</strong>

            </div>

        </div>

    </div>

</footer>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">
</script>


<script src="/js/categories.js"></script>

</body>

</html>
