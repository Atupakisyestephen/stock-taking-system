<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Login - Stock Taking System
    </title>


    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">


</head>


<body
    class="bg-light d-flex align-items-center min-vh-100">


<div class="container">


    <div class="row justify-content-center">


        <div class="col-12 col-sm-10 col-md-6 col-lg-4">


            <div class="card shadow border-0">


                <div class="card-body p-4">


                    <div class="text-center mb-4">


                        <div
                            class="bg-primary text-white rounded-circle d-inline-flex align-items-center justify-content-center"
                            style="width:70px;height:70px;">

                            <i
                                class="bi bi-box-seam fs-2">
                            </i>

                        </div>


                        <h3 class="mt-3 mb-1">
                            Stock Taking System
                        </h3>


                        <p class="text-muted">
                            Sign in to continue
                        </p>


                    </div>


                    <div
                        id="message">
                    </div>


                    <form id="loginForm">


                        <div class="mb-3">

                            <label
                                for="email"
                                class="form-label">

                                Email

                            </label>


                            <div class="input-group">

                                <span class="input-group-text">

                                    <i class="bi bi-envelope"></i>

                                </span>


                                <input
                                    type="email"
                                    id="email"
                                    class="form-control"
                                    placeholder="Enter your email"
                                    required>

                            </div>

                        </div>



                        <div class="mb-3">

                            <label
                                for="password"
                                class="form-label">

                                Password

                            </label>


                            <div class="input-group">

                                <span class="input-group-text">

                                    <i class="bi bi-lock"></i>

                                </span>


                                <input
                                    type="password"
                                    id="password"
                                    class="form-control"
                                    placeholder="Enter your password"
                                    required>


                                <button
                                    type="button"
                                    class="btn btn-outline-secondary"
                                    id="togglePassword">

                                    <i
                                        class="bi bi-eye"
                                        id="passwordIcon">
                                    </i>

                                </button>

                            </div>

                        </div>



                        <button
                            type="submit"
                            class="btn btn-primary w-100"
                            id="loginButton">

                            <i
                                class="bi bi-box-arrow-in-right me-1">
                            </i>

                            Login

                        </button>


                    </form>


                </div>


                <div
                    class="card-footer text-center text-muted small">

                    Stock Taking System

                </div>


            </div>


        </div>


    </div>


</div>


<script src="/js/login.js"></script>

</body>

</html>
